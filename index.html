/* What should I read next? — scores TBR books by how you rated finished books with the same
   moods, genres and authors, plus your priorities. */
function suggestNext(books, avoidId) {
  const tbr = books.filter((b) => b.status === 'tbr');
  if (!tbr.length) return null;
  const finishedIds = new Set(books.filter((b) => b.status === 'finished').map((b) => b.id));
  const byId = new Map(books.map((b) => [b.id, b]));
  const tags = (b) => [...(b.genres || []).map((g) => 'g:' + g), ...[...moodsOf(b)].map((m) => 'm:' + m), b.author ? 'a:' + norm(b.author) : null].filter(Boolean);
  const label = (t) => t.startsWith('m:') ? (MOODS.find((m) => m[0] === t.slice(2)) || [])[1] + ' books'
    : t.startsWith('g:') ? t.slice(2) : 'books by ' + ((books.find((b) => 'a:' + norm(b.author) === t) || {}).author || 'this author');
  const rated = books.filter((b) => b.status === 'finished' && b.rating > 0);
  const w = {};
  rated.forEach((b) => tags(b).forEach((t) => { w[t] = (w[t] || 0) + (b.rating - 3); }));
  let best = null;
  tbr.forEach((b) => {
    let score = 0, top = null;
    tags(b).forEach((t) => { const v = w[t] || 0; score += v; if (v > 0 && (!top || v > (w[top] || 0))) top = t; });
    score += { high: 2, medium: 1, low: 0.3 }[b.priority] || 0;
    if (b.nextUp) score += 2.5;
    if (b.seriesPrev && byId.has(b.seriesPrev) && !finishedIds.has(b.seriesPrev)) score -= 6;
    if (b.id === avoidId) score -= 50;
    score += Math.random() * 0.6;
    if (!best || score > best.score) best = { book: b, score, top };
  });
  const b = best.book;
  let reason;
  if (best.top) reason = 'You rate ' + label(best.top) + ' highly — this one fits.';
  else if (b.nextUp) reason = 'You marked it as next up.';
  else if (b.priority === 'high') reason = 'It is one of your high-priority books.';
  else if (!rated.length) reason = 'Rate a few finished books and the suggestions become personal.';
  else reason = 'A good change of pace from your recent reads.';
  return { book: b, reason };
}

const lastName = (a) => { const p = String(a || '').split(',')[0].trim().split(/\s+/); return p[p.length - 1] || ''; };
async function lookupOpenLibrary(b) {
  const fields = 'key,title,author_name,first_publish_year,cover_i,subject,number_of_pages_median';
  const ln = norm(lastName(b.author));
  const titles = [b.title, ...(Array.isArray(b.altTitles) ? b.altTitles : [])].slice(0, 3);
  for (const t of titles) {
    const r = await withTimeout('https://openlibrary.org/search.json?limit=6&lang=de&fields=' + fields + '&title=' + encodeURIComponent(t) + (ln ? '&author=' + encodeURIComponent(lastName(b.author)) : ''), 10000);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const doc = (j.docs || []).find((d) => !ln || (d.author_name || []).some((a) => norm(a).includes(ln)));
    if (doc) return doc;
  }
  return null;
}

function fileToCover(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('Not an image'));
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 360 / img.width);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.78));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read image')); };
    img.src = url;
  });
}

const LANGS = { eng: 'English', ger: 'German', fre: 'French', spa: 'Spanish', ita: 'Italian', por: 'Portuguese', dut: 'Dutch', jpn: 'Japanese', rus: 'Russian', chi: 'Chinese', swe: 'Swedish', nor: 'Norwegian', dan: 'Danish', pol: 'Polish', tur: 'Turkish' };

function pickGenres(subs) {
  if (!Array.isArray(subs)) return [];
  const low = subs.map((s) => String(s).toLowerCase());
  const out = [];
  for (const g of GENRES) {
    const gl = g.toLowerCase();
    if (low.some((s) => s === gl || s.includes(gl))) out.push(g);
    if (out.length >= 3) break;
  }
  return out;
}
async function withTimeout(url, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try { return await fetch(url, { signal: ctrl.signal }); } finally { clearTimeout(t); }
}
async function searchOpenLibrary(q) {
  const fields = 'key,title,author_name,first_publish_year,cover_i,subject,number_of_pages_median,language';
  const r = await withTimeout('https://openlibrary.org/search.json?limit=16&fields=' + fields + '&q=' + encodeURIComponent(q), 8000);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  return (j.docs || []).filter((d) => d.title).map((d) => ({
    source: 'openlibrary', olKey: d.key || '', title: d.title,
    author: (d.author_name || []).slice(0, 2).join(', '),
    year: d.first_publish_year ? String(d.first_publish_year) : '',
    coverUrl: d.cover_i ? 'https://covers.openlibrary.org/b/id/' + d.cover_i + '-M.jpg' : '',
    genres: pickGenres(d.subject), pages: d.number_of_pages_median ? String(d.number_of_pages_median) : '',
    language: Array.isArray(d.language) && d.language.length === 1 ? (LANGS[d.language[0]] || '') : '',
    description: null,
  }));
}
async function fetchOLDescription(key) {
  if (!key) return '';
  try {
    const r = await withTimeout('https://openlibrary.org' + key + '.json', 8000);
    if (!r.ok) return '';
    const j = await r.json();
    let d = j.description;
    if (d && typeof d === 'object') d = d.value;
    if (typeof d !== 'string') return '';
    d = d.split(/\n\s*-{3,}|\n\s*\*{3,}|\(\[source\]/)[0];
    return d.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/\r/g, '').trim();
  } catch (e) { return ''; }
}
async function searchClaude(sample, q) {
  const prompt = `You help a reader find books for their personal reading list. Their search: "${q.replace(/"/g, "'")}"
Return ONLY a JSON array (no prose, no code fences) of up to 8 real, published books that match this search by title or by author.
Each item: {"title": string, "author": string, "year": number|null (first publication year), "genres": string[] (max 3, e.g. "Fantasy"), "pages": number|null, "language": string|null (original language), "summary": string}.
Rules: include only books you are confident really exist. If you are unsure about any field, use null (or "" for summary). The summary is 2–3 neutral sentences about the premise, no spoilers. Never invent books or details. If nothing matches, return [].`;
  const res = await sample(prompt, { modelTier: 'default' });
  const txt = (res && res.text) || '';
  const m = txt.match(/\[[\s\S]*\]/);
  if (!m) throw new Error('parse');
  const arr = JSON.parse(m[0]);
  const num = (v) => (v !== null && v !== '' && Number.isFinite(+v) && +v > 0 ? String(Math.round(+v)) : '');
  return arr.filter((x) => x && x.title).slice(0, 8).map((x) => ({
    source: 'claude', olKey: '', coverUrl: '', title: String(x.title), author: String(x.author || ''),
    year: num(x.year), pages: num(x.pages), language: x.language ? String(x.language) : '',
    genres: Array.isArray(x.genres) ? x.genres.slice(0, 3).map(String) : [],
    description: typeof x.summary === 'string' ? x.summary.trim() : '',
  }));
}

/* ───────────────────────── storage hook ───────────────────────── */
function useLibrary(toast) {
  const init = useMemo(loadLocal, []);
  const [books, setBooksState] = useState(Array.isArray(init.books) ? init.books : []);
  const [settings, setSettings] = useState({ goal: 12, ...(init.settings || {}) });
  const [sync, setSync] = useState('connecting');
  const booksRef = useRef(books);
  const settingsRef = useRef(settings);
  const dbRef = useRef(null);
  const queues = useRef({});
  const setBooks = (n) => { booksRef.current = n; setBooksState(n); };
  const seedFn = useRef(() => {});
  const seeded = useRef(false);

  useEffect(() => { saveLocal({ books, settings }); }, [books, settings]);

  const enqueue = (key, fn) => {
    const q = queues.current;
    q[key] = (q[key] || Promise.resolve()).then(fn).catch((e) => {
      if (e && e.code === 'quota_exceeded') toast('Your library storage is full — export a backup and remove some cover images.', 'error');
      else if (e && e.code === 'revoked') { dbRef.current = null; setSync('local'); }
    });
  };
  const pushBook = (b) => { const r = dbRef.current; if (r) enqueue(b.id, () => r.col.doc(b.id).set(clean(b))); };
  const dropBook = (id) => { const r = dbRef.current; if (r) enqueue(id, () => r.col.doc(id).delete()); };

  useEffect(() => {
    let alive = true, unsub = null, timer = null;
    (async () => {
      const db = await getCap('db');
      const user = db ? await getCap('user') : null;
      const uid = user ? await user.id() : null;
      if (!alive) return;
      if (!db || !uid) { setSync('local'); seedFn.current(); return; }
      let col, sdoc;
      try {
        col = db.doc('data/users/' + uid + '/library').collection('books');
        sdoc = db.doc('data/users/' + uid + '/settings');
      } catch (e) { setSync('local'); seedFn.current(); return; }
      dbRef.current = { col, sdoc };
      try {
        const s = await Promise.race([sdoc.get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))]);
        if (alive && s.exists) { const n = { ...settingsRef.current, ...s.data() }; settingsRef.current = n; setSettings(n); }
      } catch (e) {}
      if (!alive) return;
      timer = setTimeout(() => { if (alive) setSync((s) => (s === 'connecting' ? 'slow' : s)); }, 10000);
      let settled = false;
      unsub = col.onSnapshot((snap) => {
        if (!alive) return;
        const docs = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
        if (!snap.metadata.fromCache && !settled) {
          settled = true; clearTimeout(timer); setSync('cloud');
          if (snap.empty && booksRef.current.length) { booksRef.current.forEach(pushBook); seedFn.current(); return; }
          setBooks(docs); seedFn.current(); return;
        }
        if (settled || !snap.empty) setBooks(docs);
      }, () => { clearTimeout(timer); if (alive) { dbRef.current = null; setSync('local'); seedFn.current(); } });
    })();
    return () => { alive = false; if (unsub) unsub(); clearTimeout(timer); };
  }, []);

  const upsert = useCallback((b) => {
    const prev = booksRef.current;
    const i = prev.findIndex((x) => x.id === b.id);
    const n = i < 0 ? [b, ...prev] : prev.map((x, j) => (j === i ? b : x));
    setBooks(n); pushBook(b);
  }, []);
  const update = useCallback((id, patch) => {
    const cur = booksRef.current.find((b) => b.id === id);
    if (!cur) return;
    upsert(typeof patch === 'function' ? patch(cur) : { ...cur, ...patch });
  }, []);
  const remove = useCallback((id) => { setBooks(booksRef.current.filter((b) => b.id !== id)); dropBook(id); }, []);
  const saveSettings = useCallback((patch) => {
    const n = { ...settingsRef.current, ...patch };
    settingsRef.current = n; setSettings(n);
    const r = dbRef.current; if (r) enqueue('__settings', () => r.sdoc.set(clean(n)));
  }, []);
  const importBooks = useCallback((arr, mode, settingsIn) => {
    const incoming = arr.filter((x) => x && typeof x.title === 'string' && x.title.trim()).map((x) => {
      const b = makeBook({ ...x, id: typeof x.id === 'string' && /^[A-Za-z0-9_\-]{1,60}$/.test(x.id) ? x.id : newId() });
      b.genres = Array.isArray(b.genres) ? b.genres.map(String) : [];
      b.status = STATUS[b.status] ? b.status : 'tbr';
      b.rating = Math.max(0, Math.min(5, Math.round(+b.rating || 0)));
      return b;
    });
    let next;
    if (mode === 'replace') {
      const keep = new Set(incoming.map((b) => b.id));
      booksRef.current.forEach((b) => { if (!keep.has(b.id)) dropBook(b.id); });
      next = incoming;
    } else {
      const m = new Map(booksRef.current.map((b) => [b.id, b]));
      incoming.forEach((b) => m.set(b.id, b));
      next = [...m.values()];
    }
    setBooks(next); incoming.forEach(pushBook);
    if (settingsIn && typeof settingsIn === 'object' && +settingsIn.goal > 0) saveSettings({ goal: Math.round(+settingsIn.goal) });
    return incoming.length;
  }, []);

  // Starter wishlist: each title is added at most once (remembered in settings), and never if a
  // book with the same id or title (incl. original title) is already on your shelves.
  seedFn.current = () => {
    if (seeded.current) return; seeded.current = true;
    const prevKeys = Array.isArray(settingsRef.current.seededKeys) ? settingsRef.current.seededKeys : [];
    const done = new Set(prevKeys);
    const ids = new Set(booksRef.current.map((b) => b.id));
    const titles = new Set(booksRef.current.flatMap((b) => [b.title, ...(Array.isArray(b.altTitles) ? b.altTitles : [])]).map(norm));
    const now = Date.now(); const added = [];
    SEED_BOOKS.forEach((sd, i) => {
      if (done.has(sd.key)) return;
      done.add(sd.key);
      if (ids.has(sd.id) || [sd.title, ...sd.alt].some((t) => titles.has(norm(t)))) return;
      added.push(makeBook({ ...sd.book, addedAt: new Date(now - i * 1000).toISOString() }));
    });
    if (added.length) { setBooks([...booksRef.current, ...added]); added.forEach(pushBook); }
    if (done.size !== prevKeys.length) saveSettings({ seededKeys: [...done] });
  };
  const getBooks = useCallback(() => booksRef.current, []);

  return { books, settings, sync, upsert, update, remove, saveSettings, importBooks, getBooks };
}

const needsDetails = (b, retry) => (b.enrich === '' || b.enrich == null || (retry && b.enrich === 'failed'))
  && ((!b.cover && !b.coverUrl) || !b.year || !b.description || !b.pages);

function useEnrichment(lib) {
  const [st, setSt] = useState({ phase: 'idle', done: 0, total: 0, found: 0 });
  const [hidden, setHiddenState] = useState(() => { try { return localStorage.getItem('booklibrary.detailsHidden') === '1'; } catch (e) { return false; } });
  const setHidden = (v) => { setHiddenState(v); try { localStorage.setItem('booklibrary.detailsHidden', v ? '1' : '0'); } catch (e) {} };
  const busy = useRef(false);
  const stop = useRef(false);
  const run = useCallback(async (retry) => {
    if (busy.current) return;
    const queue = lib.getBooks().filter((b) => needsDetails(b, retry)).map((b) => b.id);
    if (!queue.length) { setSt({ phase: 'done', done: 0, total: 0, found: 0 }); return; }
    busy.current = true; stop.current = false;
    let done = 0, found = 0, reachable = false;
    setSt({ phase: 'running', done, total: queue.length, found });
    for (const id of queue) {
      if (stop.current) break;
      const b = lib.getBooks().find((x) => x.id === id);
      if (!b) { done++; continue; }
      try {
        const doc = await lookupOpenLibrary(b);
        reachable = true;
        if (doc) {
          found++;
          let desc = '';
          if (!b.description && doc.key) desc = await fetchOLDescription(doc.key);
          lib.update(id, (cur) => ({
            ...cur,
            coverUrl: cur.cover || cur.coverUrl ? cur.coverUrl : (doc.cover_i ? 'https://covers.openlibrary.org/b/id/' + doc.cover_i + '-M.jpg' : ''),
            year: cur.year || (doc.first_publish_year ? String(doc.first_publish_year) : ''),
            pages: cur.pages || (doc.number_of_pages_median ? String(doc.number_of_pages_median) : ''),
            genres: cur.genres && cur.genres.length ? cur.genres : pickGenres(doc.subject),
            olKey: cur.olKey || doc.key || '',
            description: cur.description || desc,
            descriptionSource: cur.description ? cur.descriptionSource : (desc ? 'openlibrary' : ''),
            enrich: 'ok',
          }));
        } else lib.update(id, { enrich: 'notfound' });
      } catch (e) {
        if (!reachable) { busy.current = false; setSt({ phase: 'unreachable', done: 0, total: queue.length, found: 0 }); return; }
        lib.update(id, { enrich: 'failed' });
      }
      done++;
      setSt({ phase: 'running', done, total: queue.length, found });
      await new Promise((r) => setTimeout(r, 350));
    }
    busy.current = false;
    setSt({ phase: 'done', done, total: queue.length, found });
  }, []);
  return { st, run, hidden, setHidden, stop: () => { stop.current = true; } };
}

function DetailsPanel({ books, enr }) {
  const { hidden, setHidden } = enr;
  const missing = books.filter((b) => needsDetails(b, true)).length;
  if (hidden && enr.st.phase !== 'running') return null;
  const { phase, done, total, found } = enr.st;
  if (phase !== 'running' && !missing && phase !== 'done') return null;
  if (phase === 'done' && !missing && !total) return null;
  return html`<div className="mb-4 border-l-4 border-forest bg-[#EDF1EA] px-4 py-3 rise">
    ${phase === 'running' ? html`<div>
        <div className="flex items-center justify-between gap-3 text-[15px]"><span className="font-semibold text-navy">Loading book details from Open Library…</span><span className="text-navy/70">${done} / ${total}</span></div>
        <div className="mt-2 h-1.5 bg-white/70 overflow-hidden"><div className="h-full bg-navy transition-all" style=${{ width: Math.round(done / Math.max(1, total) * 100) + '%' }}></div></div>
        <button type="button" className="mt-2 text-sm font-semibold text-navy underline" onClick=${enr.stop}>Stop</button></div>`
    : phase === 'unreachable' ? html`<div className="flex gap-3 items-start">
        <span className="text-rouge mt-0.5"><${Icon} name="wifiOff" size=${18} /></span>
        <div className="flex-1 text-[15px] text-ink/85"><b className="text-navy">Open Library can't be reached right now.</b> You may be offline. ${missing} books keep their placeholder cover for now — nothing is invented. Try again when you're online.
          <div className="mt-2 flex gap-3"><button type="button" className="font-semibold text-navy underline" onClick=${() => enr.run(true)}>Try again</button><button type="button" className="text-ink/60 underline" onClick=${() => setHidden(true)}>Hide</button></div></div></div>`
    : phase === 'done' ? html`<div className="flex items-center justify-between gap-3 text-[15px]"><span className="text-navy"><b>Done.</b> Details found for ${found} of ${total} books${missing ? ' · ' + missing + ' still incomplete' : ''}.</span><button type="button" className="text-ink/60 underline text-sm" onClick=${() => setHidden(true)}>Hide</button></div>`
    : html`<div className="flex items-center justify-between gap-3 text-[15px]"><span className="text-navy">${missing} books have no cover or summary yet.</span><button type="button" className="btn-primary !py-1.5" onClick=${() => { setHidden(false); enr.run(true); }}>Load details</button></div>`}
  </div>`;
}

const PALETTES = [['#5E1A26', '#7F2A38'], ['#1D3526', '#33503C'], ['#4A2619', '#6E3A24'], ['#6E1E2B', '#8E3442'], ['#24402F', '#3B5E46'], ['#3A2A1E', '#5E4530']];

function BookForm({ initial, onSubmit, onCancel, submitLabel, showStatus }) {
  const [f, setF] = useState(() => ({ title: '', author: '', year: '', pages: '', language: '', description: '', status: 'tbr', cover: '', owned: false, ...(initial || {}), genresText: ((initial && initial.genres) || []).join(', ') }));
  const [err, setErr] = useState('');
  const set = (k) => (e) => setF((p) => ({ ...p, [k]: e.target.value }));
  const onCover = async (e) => {
    const file = e.target.files && e.target.files[0]; e.target.value = '';
    if (!file) return;
    try { const c = await fileToCover(file); setF((p) => ({ ...p, cover: c })); } catch (x) { setErr('That image could not be read.'); }
  };
  const submit = (e) => {
    e.preventDefault();
    if (!f.title.trim()) { setErr('Please add a title.'); return; }
    const genres = f.genresText.split(',').map((s) => s.trim()).filter(Boolean).slice(0, 6);
    const { genresText, ...rest } = f;
    onSubmit({ ...rest, owned: f.status !== 'tbr' || !!f.owned, title: f.title.trim(), author: f.author.trim(), year: String(f.year || '').trim(), pages: String(f.pages || '').trim(), language: f.language.trim(), description: f.description.trim(), genres });
  };
  return html`<form onSubmit=${submit} className="space-y-4">
    <div className="flex gap-4">
      <label className="shrink-0 cursor-pointer group" title="Add a cover photo">
        <div className="relative w-24 h-36 rounded-lg overflow-hidden shadow-md">
          ${f.cover ? html`<img src=${f.cover} alt="" className="w-full h-full object-cover" />` : html`<${Cover} book=${{ title: f.title || 'Your book', author: f.author }} className="w-full h-full" />`}
          <div className="absolute inset-x-0 bottom-0 bg-black/45 text-cream text-[11px] font-semibold py-1 flex items-center justify-center gap-1 group-hover:bg-black/60 transition"><${Icon} name="image" size=${12} />${f.cover ? 'Change' : 'Cover'}</div>
        </div>
        <input type="file" accept="image/*" className="sr-only" onChange=${onCover} />
      </label>
      <div className="flex-1 min-w-0 space-y-3">
        <div><label className="label">Title *</label><input className="field" value=${f.title} onChange=${set('title')} placeholder="e.g. The Alchemist" autoFocus=${!initial || !initial.title} /></div>
        <div><label className="label">Author</label><input className="field" value=${f.author} onChange=${set('author')} placeholder="e.g. Paulo Coelho" /></div>
      </div>
    </div>
    <div className="grid grid-cols-3 gap-2.5">
      <div><label className="label">Year</label><input className="field" inputMode="numeric" value=${f.year} onChange=${set('year')} placeholder="1988" /></div>
      <div><label className="label">Pages</label><input className="field" inputMode="numeric" value=${f.pages} onChange=${set('pages')} placeholder="208" /></div>
      <div><label className="label">Language</label><input className="field" value=${f.language} onChange=${set('language')} placeholder="English" /></div>
    </div>
    <div><label className="label">Genres</label><input className="field" value=${f.genresText} onChange=${set('genresText')} placeholder="Fantasy, Classics (comma separated)" /></div>
    ${showStatus && html`<div><label className="label">Shelf</label><${StatusPicker} value=${f.status} onChange=${(v) => setF((p) => ({ ...p, status: v }))} /></div>`}
    ${showStatus && f.status === 'tbr' && html`<div><label className="label">Add to</label>
      <div className="grid grid-cols-2 gap-1 p-1 rounded-[3px] bg-parchment/50 border border-parchment">
        ${[[false, 'Wishlist'], [true, 'Already own it']].map(([k, l]) => html`<button key=${l} type="button" onClick=${() => setF((p) => ({ ...p, owned: k }))} aria-pressed=${!!f.owned === k}
          className=${cx('rounded-[2px] py-2 px-1 font-caps text-[14px] tracking-[.08em] transition', !!f.owned === k ? (k ? 'bg-forest text-[#F1E3BE] shadow' : 'bg-wine text-[#F6E7D2] shadow') : 'text-wood hover:bg-paper')}>${l}</button>`)}
      </div></div>`}
    <div><label className="label">Summary</label><textarea className="field min-h-[96px]" value=${f.description} onChange=${set('description')} placeholder="Optional — a short summary in your own words" /></div>
    ${err && html`<p className="text-sm text-rose-700">${err}</p>`}
    <div className="flex justify-end gap-2 pt-1">
      ${onCancel && html`<button type="button" className="btn-ghost" onClick=${onCancel}>Cancel</button>`}
      <button type="submit" className="btn-primary"><${Icon} name="check" size=${16} />${submitLabel || 'Save'}</button>
    </div>
  </form>`;
}

function Shelf({ title, books, onOpen }) {

  return html`<section className="mt-7 rise">
    <${Heading}>${title}<//>
    <div className="flex gap-3.5 overflow-x-auto no-scrollbar pb-2 -mx-4 px-4 sm:mx-0 sm:px-0">
      ${books.map((b) => html`<button key=${b.id} onClick=${() => onOpen(b.id)} className="shrink-0 w-[104px] text-left group">

      </button>`)}
    </div>
  </section>`;

function Discover({ books, onAdd, onOpen, onManual, focusKey, onSuggest, onRandom }) {
  const [q, setQ] = useState('');
  const [lastQ, setLastQ] = useState('');
  const [phase, setPhase] = useState('idle');
  const [results, setResults] = useState([]);
  const [source, setSource] = useState('');
  const [notice, setNotice] = useState(null);
  const reqId = useRef(0);
  const inputRef = useRef(null);
  useEffect(() => { if (focusKey && inputRef.current) inputRef.current.focus(); }, [focusKey]);

  const run = async (raw) => {
    const query = String(raw != null ? raw : q).trim();
    if (!query) return;
    setQ(query); setLastQ(query);
    const id = ++reqId.current;
    setPhase('loading'); setNotice(null); setResults([]);
    try {
      const r = await searchOpenLibrary(query);
      if (id !== reqId.current) return;
      setSource('openlibrary'); setResults(r); setPhase('done'); return;
    } catch (e) { /* fall back below */ }
    if (id !== reqId.current) return;
    const sample = await getCap('sample');
    if (id !== reqId.current) return;
    if (!sample) { setNotice('offline'); setPhase('error'); return; }
    setNotice('claude'); setSource('claude');
    try {
      const r = await searchClaude(sample, query);
      if (id !== reqId.current) return;
      setResults(r); setPhase('done');
    } catch (e) {
      if (id !== reqId.current) return;
      setNotice(e && e.code === 'rate_limited' ? 'busy' : 'failed'); setPhase('error');
    }
  };
  const loadDesc = async (r) => {
    setResults((rs) => rs.map((x) => (x.olKey === r.olKey ? { ...x, descLoading: true } : x)));
    const d = await fetchOLDescription(r.olKey);
    setResults((rs) => rs.map((x) => (x.olKey === r.olKey ? { ...x, description: d, descLoading: false } : x)));
  };
  const findInLib = (r) => books.find((b) => (r.olKey && b.olKey === r.olKey) || (norm(b.title) === norm(r.title) && norm(b.author) === norm(r.author)));
  const reading = books.filter((b) => b.status === 'reading');
  const nextUp = books.filter((b) => b.status === 'tbr').sort((a, b) => (b.nextUp - a.nextUp) || (PRIO_RANK[a.priority || ''] - PRIO_RANK[b.priority || ''])).slice(0, 10);

  return html`<div>
    <form onSubmit=${(e) => { e.preventDefault(); run(); }} className="card p-1.5 flex items-center gap-2 sticky top-2 z-20 border-gold/50">
      <div className="pl-2 text-rouge"><${Icon} name="search" size=${20} /></div>
      <input ref=${inputRef} value=${q} onChange=${(e) => setQ(e.target.value)} type="search" enterKeyHint="search"
        placeholder="Search by title or author…" className="flex-1 min-w-0 bg-transparent py-2.5 text-[18px] placeholder:italic text-ink placeholder:text-stone-400 focus:outline-none" aria-label="Search books" />
      <button type="submit" className="btn-primary" disabled=${!q.trim() || phase === 'loading'}>Search</button>
    </form>

    ${phase === 'idle' && html`<div>
      <section className="mt-6 card-framed p-6 sm:p-8 text-center rise">
                <p className="label">Discover</p>
        <h2 className="font-display text-[30px] sm:text-[34px] text-ink leading-tight">What story is calling you next?</h2>
        <${Ornament} className="mx-auto my-3" />
        <p className="text-wood/80 italic">Search by title or author, then place the book on a shelf with one tap.</p>
        <div className="flex flex-wrap justify-center gap-2 mt-5">
          ${EXAMPLES.map((ex) => html`<button key=${ex} type="button" className="chip chip-off" onClick=${() => run(ex)}>${ex}</button>`)}
        </div>
      </section>
      ${books.some((b) => b.status === 'tbr') && html`<section className="mt-5 grid grid-cols-2 gap-3 rise">
        <button type="button" onClick=${onSuggest} className="text-left p-4 bg-[#7A2232] text-[#F6E7D2] shadow-card hover:shadow-lift transition outline outline-1 outline-offset-[-6px] outline-[#D9B865]/50">
          <${Icon} name="wand" size=${20} /><p className="font-display text-[22px] font-semibold leading-tight mt-2">What should I read next?</p><p className="text-[13px] opacity-85 mt-1">Based on your ratings and favourite moods</p></button>
        <button type="button" onClick=${() => onRandom()} className="text-left p-4 bg-[#24402F] text-[#F1E3BE] shadow-card hover:shadow-lift transition outline outline-1 outline-offset-[-6px] outline-[#D9B865]/50">
          <${Icon} name="shuffle" size=${20} /><p className="font-display text-[22px] font-semibold leading-tight mt-2">Random book picker</p><p className="text-[13px] opacity-85 mt-1">Let chance choose from your TBR</p></button>
      </section>`}
      <${Shelf} title="Continue reading" books=${reading} onOpen=${onOpen} />
      <${Shelf} title="Waiting on your TBR" books=${nextUp} onOpen=${onOpen} />
    </div>`}

    ${notice === 'claude' && html`<div className="mt-4 border border-gold/50 bg-[#FBF5E6] px-4 py-3 text-[15px] text-wood flex gap-3 rise">
      <span className="text-rouge mt-0.5"><${Icon} name="wifiOff" size=${18} /></span>
      <div><b className="text-ink">The live book database can't be reached right now.</b> These are <b>suggestions from Claude's general knowledge</b> — details may be incomplete or wrong.</div>
    </div>`}

    ${phase === 'loading' && html`<div className="mt-5 grid gap-3 sm:grid-cols-2">
      ${[0, 1, 2, 3].map((i) => html`<div key=${i} className="card p-3.5 flex gap-3.5"><div className="skeleton w-[76px] h-[114px] rounded-md"></div><div className="flex-1 space-y-2 pt-1"><div className="skeleton h-4 rounded w-3/4"></div><div className="skeleton h-3 rounded w-1/2"></div><div className="skeleton h-3 rounded w-2/3 mt-4"></div></div></div>`)}
      <p className="sm:col-span-2 text-center text-sm text-wood/70">${source === 'claude' || notice === 'claude' ? 'Asking Claude for matching books…' : 'Searching the stacks…'}</p>
    </div>`}

    ${phase === 'error' && html`<div className="mt-5"><${Empty} 
        title=${notice === 'busy' ? 'Too many searches at once' : "Couldn't reach a book source"}
        text=${notice === 'busy' ? 'Give it a moment, then try again. You can always add the book by hand.' : 'The book search isn’t available right now. No worries — you can still add the book by hand in a few seconds.'}>
        <button className="btn-primary" onClick=${() => onManual({ title: lastQ })}><${Icon} name="pencil" size=${15} />Add “${lastQ}” manually</button>
        <button className="btn-soft" onClick=${() => run(lastQ)}>Try again</button>
      <//></div>`}

    ${phase === 'done' && html`<div className="mt-5">
      <div className="flex items-baseline justify-between gap-3 mb-3">
        <p className="text-sm text-wood/80">${results.length ? html`<b className="text-ink">${results.length}</b> ${source === 'claude' ? 'suggestions from Claude' : 'results from Open Library'} for “${lastQ}”` : ''}</p>
        <button type="button" className="text-sm font-semibold text-forest hover:underline shrink-0" onClick=${() => { setPhase('idle'); setResults([]); setNotice(null); setQ(''); }}>Clear</button>
      </div>
      ${results.length === 0
        ? html`<${Empty} title="No books found" text=${`Nothing matched “${lastQ}”. Try another spelling, or add the book yourself.`}>
            <button className="btn-primary" onClick=${() => onManual({ title: lastQ })}><${Icon} name="pencil" size=${15} />Add manually</button><//>`
        : html`<div className="grid gap-3 sm:grid-cols-2">${results.map((r, i) => html`<${ResultCard} key=${(r.olKey || r.title) + i} r=${r} inLib=${findInLib(r)} onAdd=${onAdd} onLoadDesc=${loadDesc} onOpen=${onOpen} />`)}</div>
          <p className="text-center text-sm text-wood/70 mt-5">Can't find it? <button className="font-semibold text-forest hover:underline" onClick=${() => onManual({ title: lastQ })}>Add it manually</button></p>`}
    </div>`}
  </div>`;
}

      ${b.favorite && html`<span className="absolute top-2 right-2 grid place-items-center w-7 h-7 rounded-full bg-cream/90 text-rouge shadow"><${Icon} name="heart" size=${14} fill="currentColor" /></span>`}
    </button>
    <div className="p-3 flex flex-col gap-1 flex-1">
      <h3 className="font-display text-[18px] font-semibold leading-snug text-ink line-clamp-2">${b.title}</h3>
      <p className="text-xs text-wood/80 truncate">${b.author || 'Unknown author'}</p>
      <div className="flex items-center justify-between gap-2 mt-0.5">
        <${Stars} value=${b.rating} size=${13} />
      </div>
      <${MoodTags} b=${b} max=${2} />
      <div className="mt-auto pt-2.5 flex gap-1.5">
        <button type="button" onClick=${() => onOpen(b.id)} className="btn-soft !px-2 !py-1.5 text-xs flex-1">Details</button>
        ${next && html`<button type="button" onClick=${() => onQuick(b, next.to)} className="btn-primary !px-2.5 !py-1.5 text-xs" title=${'Move to ' + STATUS[next.to].label}><${Icon} name=${next.icon} size=${12} />${next.label}</button>`}
      </div>
    </div>
  </article>`;
}

function Library({ books: allBooks, onOpen, onQuick, onAdd, goDiscover, enr }) {
  const [status, setStatus] = useState('all');
  const col = 'all';
  const shelf = useMemo(() => allBooks.filter(inLibrary), [allBooks]);
  const books = shelf;
  const [mood, setMood] = useState('all');
  const [rating, setRating] = useState('any');
  const [genre, setGenre] = useState('all');
  const [sort, setSort] = useState('added');
  const [q, setQ] = useState('');
  const genres = useMemo(() => {
    const m = {}; books.forEach((b) => (b.genres || []).forEach((g) => { m[g] = (m[g] || 0) + 1; }));
    return Object.keys(m).sort((a, b) => m[b] - m[a] || a.localeCompare(b));
  }, [books]);
  const counts = useMemo(() => ({
    all: books.length, tbr: books.filter((b) => b.status === 'tbr').length, reading: books.filter((b) => b.status === 'reading').length,
    finished: books.filter((b) => b.status === 'finished').length, fav: books.filter((b) => b.favorite).length,
  }), [books]);
  const list = useMemo(() => {
    const nq = norm(q);
    let l = books.filter((b) => {
      if (status === 'fav' ? !b.favorite : status !== 'all' && b.status !== status) return false;
      if (rating === 'unrated' ? b.rating > 0 : rating !== 'any' && (b.rating || 0) < +rating) return false;
      if (genre !== 'all' && !(b.genres || []).includes(genre)) return false;
      if (col === 'fitzek' && !isFitzek(b)) return false;
      if (col === 'mustread' && !b.mustRead) return false;
      if (mood !== 'all' && !moodsOf(b).has(mood)) return false;
      if (nq && !norm(b.title + ' ' + b.author).includes(nq)) return false;
      return true;
    });
    const by = {
      added: (a, b) => String(b.addedAt).localeCompare(String(a.addedAt)),
      title: (a, b) => a.title.localeCompare(b.title),
      author: (a, b) => (a.author || '~').localeCompare(b.author || '~') || a.title.localeCompare(b.title),
      rating: (a, b) => (b.rating || 0) - (a.rating || 0) || a.title.localeCompare(b.title),
      finished: (a, b) => String(b.finishedAt || '').localeCompare(String(a.finishedAt || '')),
      order: (a, b) => (+a.seriesOrder || 999) - (+b.seriesOrder || 999) || a.title.localeCompare(b.title),
    };
    return l.slice().sort(by[sort]);
  }, [books, status, rating, genre, sort, q, col, mood]);
  const tabs = [['all', 'All'], ['tbr', 'To Be Read'], ['reading', 'Reading'], ['finished', 'Finished'], ['fav', 'Favorites']];
  const filtered = status !== 'all' || rating !== 'any' || genre !== 'all' || q || col !== 'all' || mood !== 'all';
  const moodCounts = useMemo(() => { const c = {}; books.forEach((b) => moodsOf(b).forEach((m) => { c[m] = (c[m] || 0) + 1; })); return c; }, [books]);

  if (!allBooks.length) return html`<${Empty} title="Your shelves are waiting" text="Search for a book you love or want to read, or add one by hand. Every library starts with a single story.">
    <button className="btn-primary" onClick=${goDiscover}><${Icon} name="search" size=${15} />Find a book</button>
    <button className="btn-soft" onClick=${() => onAdd()}><${Icon} name="plus" size=${15} />Add manually</button><//>`;

  return html`<div>
    <${DetailsPanel} books=${books} enr=${enr} />
    <div className="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4 sm:mx-0 sm:px-0 pb-1">
      ${tabs.map(([k, l]) => html`<button key=${k} type="button" onClick=${() => setStatus(k)} className=${cx('chip', status === k ? 'chip-on' : 'chip-off')} aria-pressed=${status === k}>
        ${l}<span className=${cx('text-[11px] rounded-full px-1.5', status === k ? 'bg-cream/20' : 'bg-parchment/70')}>${counts[k]}</span></button>`)}
    </div>
    <div className="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-2">
      <div className="col-span-2 sm:col-span-1 relative">
        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-caramel"><${Icon} name="search" size=${16} /></span>
        <input className="field !pl-9 !py-2 text-sm" value=${q} onChange=${(e) => setQ(e.target.value)} placeholder="Filter by title or author" aria-label="Filter library" />
      </div>
      <select className="field !py-2 text-sm" value=${rating} onChange=${(e) => setRating(e.target.value)} aria-label="Filter by rating">
        <option value="any">Any rating</option><option value="5">5 stars only</option><option value="4">4 stars & up</option><option value="3">3 stars & up</option><option value="unrated">Not rated</option>
      </select>
      <select className="field !py-2 text-sm" value=${genre} onChange=${(e) => setGenre(e.target.value)} aria-label="Filter by genre">
        <option value="all">All genres</option>${genres.map((g) => html`<option key=${g} value=${g}>${g}</option>`)}
      </select>
      <select className="field !py-2 text-sm col-span-2 sm:col-span-1" value=${sort} onChange=${(e) => setSort(e.target.value)} aria-label="Sort">
<option value="added">Sort: Recently added</option><option value="title">Sort: Title</option><option value="author">Sort: Author</option><option value="rating">Sort: Rating</option><option value="finished">Sort: Recently finished</option>
      </select>
    </div>
    <div className="mt-3"><${MoodFilter} value=${mood} onChange=${setMood} counts=${moodCounts} /></div>
    <div className="flex items-center justify-between mt-4 mb-3 text-sm text-wood/80">
      <span><b className="text-ink">${list.length}</b> ${list.length === 1 ? 'book' : 'books'}</span>
      ${filtered && html`<button type="button" className="font-semibold text-forest hover:underline" onClick=${() => { setStatus('all'); setRating('any'); setGenre('all'); setQ(''); setMood('all'); }}>Reset filters</button>`}
    </div>
    ${list.length
      ? html`<div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3.5 sm:gap-4">${list.map((b) => html`<${BookCard} key=${b.id} b=${b} onOpen=${onOpen} onQuick=${onQuick} />`)}</div>`
      : col === 'all' && !shelf.length
        ? html`<${Empty} title="Your library is still empty" text="Books you own live here. When you buy a book from your wishlist, tap “Bought” and it moves onto these shelves.">
            <button className="btn-primary" onClick=${() => onAdd({ owned: true })}><${Icon} name="plus" size=${15} />Add a book I own</button><//>`
        : html`<${Empty} title="No books match" text="Try loosening a filter." />`}
  </div>`;
}

/* ───────────────────────── Reading Journal ───────────────────────── */
function Stat({ label, value, sub, tone = '#7A2232' }) {
  return html`<div className="card-framed p-4 text-center rise">
    <p className="label !mb-0">${label}</p>
    <p className="font-display text-[40px] mt-1 leading-none" style=${{ color: tone }}>${value}</p>
    <div className="mx-auto mt-2 w-6 h-px bg-gold"></div>
    ${sub && html`<p className="text-xs text-wood/70 mt-1.5">${sub}</p>`}
  </div>`;
}

function Journal({ books, settings, saveSettings, onOpen, onUpdate }) {
  const [jq, setJq] = useState('');
  const [jf, setJf] = useState('all');
  const [js, setJs] = useState('date');
  const finished = books.filter((b) => b.status === 'finished');
  const reading = books.filter((b) => b.status === 'reading');
  const tbr = books.filter((b) => b.status === 'tbr');
  const rated = finished.filter((b) => b.rating > 0);
  const avg = rated.length ? (rated.reduce((s, b) => s + b.rating, 0) / rated.length) : 0;
  const year = new Date().getFullYear();
  const thisYear = finished.filter((b) => String(b.finishedAt || '').startsWith(String(year)));
  const pagesYear = thisYear.reduce((s, b) => s + (+b.pages > 0 ? +b.pages : 0), 0);
  const goal = Math.max(1, +settings.goal || 12);
  const pct = Math.min(100, Math.round(thisYear.length / goal * 100));
  const genreSrc = finished.length ? finished : books;
  const gm = {}; genreSrc.forEach((b) => (b.genres || []).forEach((g) => { gm[g] = (gm[g] || 0) + 1; }));
  const topGenres = Object.entries(gm).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const maxG = topGenres.length ? topGenres[0][1] : 1;
  const feel = FEELINGS.map(([k, l]) => [k, l, finished.filter((b) => b.feeling === k).length]);
  const jnq = norm(jq);
  const recent = finished.filter((b) => (!jnq || norm(b.title + ' ' + b.author).includes(jnq))
      && (jf === 'all' || (jf === 'fav' ? b.favorite : jf === 'top' ? b.rating >= 4 : jf === 'unrated' ? !b.rating : true)))
    .sort(js === 'rating' ? (a, b) => (b.rating || 0) - (a.rating || 0) || a.title.localeCompare(b.title)
      : js === 'title' ? (a, b) => a.title.localeCompare(b.title)
      : (a, b) => String(b.finishedAt || b.addedAt || '').localeCompare(String(a.finishedAt || a.addedAt || '')));

  if (!books.length) return html`<${Empty} title="Your journal is still blank" text="Once you add and finish books, your reading story appears here: ratings, favourite genres and your yearly goal." />`;

  return html`<div className="space-y-6">
    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
      <${Stat} label="Books read" value=${finished.length} sub=${thisYear.length + ' in ' + year} />
      <${Stat} tone="#24402F" label="Avg rating" value=${avg ? avg.toFixed(1) : '—'} sub=${rated.length ? 'from ' + rated.length + ' rated' : 'rate a finished book'} />
      <${Stat} tone="#24402F" label="Reading now" value=${reading.length} sub=${reading.length ? reading.map((b) => b.title).slice(0, 1)[0] : 'nothing open'} />
      <${Stat} tone="#7D5F2A" label="On your TBR" value=${tbr.length} sub=${tbr.filter((b) => b.nextUp).length + ' marked next up'} />
    </div>

    <section className="card p-5 rise">
      <div className="flex items-start justify-between gap-3">
        <div><h2 className="section-title">The ${year} reading goal</h2><p className="text-sm text-wood/80 mt-1">${thisYear.length} of ${goal} books${pagesYear ? ' · ' + pagesYear.toLocaleString('en-GB') + ' pages' : ''}</p></div>
        <div className="flex items-center gap-1 bg-parchment/50 rounded-full p-1">
          <button type="button" className="w-8 h-8 rounded-full hover:bg-paper text-wood font-bold" aria-label="Lower goal" onClick=${() => saveSettings({ goal: Math.max(1, goal - 1) })}>−</button>
          <span className="w-8 text-center font-display text-lg">${goal}</span>
          <button type="button" className="w-8 h-8 rounded-full hover:bg-paper text-wood font-bold" aria-label="Raise goal" onClick=${() => saveSettings({ goal: goal + 1 })}>+</button>
        </div>
      </div>
      <div className="mt-4 h-3 rounded-full bg-parchment/70 overflow-hidden"><div className="h-full rounded-full bg-gradient-to-r from-forest to-gold transition-all duration-700" style=${{ width: pct + '%' }}></div></div>
      <p className="text-xs text-wood/70 mt-2">${pct >= 100 ? 'Goal reached. Splendidly done.' : pct + '% of the way'}</p>
    </section>

    ${reading.length > 0 && html`<section className="rise">
      <${Heading}>Currently reading<//>
      <div className="grid gap-3 sm:grid-cols-2">${reading.map((b) => {
        const p = +b.pages > 0 ? Math.min(100, Math.round((+b.currentPage || 0) / +b.pages * 100)) : null;
        return html`<div key=${b.id} className="card p-3 flex gap-3 items-center">
          <button onClick=${() => onOpen(b.id)} className="shrink-0"><${Cover} book=${b} className="w-12 h-[72px] rounded shadow" /></button>
          <div className="flex-1 min-w-0">
            <button onClick=${() => onOpen(b.id)} className="font-display text-[15px] text-ink truncate block max-w-full text-left hover:underline">${b.title}</button>
            ${p !== null
              ? html`<div className="mt-1.5 h-1.5 rounded-full bg-parchment overflow-hidden"><div className="h-full bg-rouge transition-all" style=${{ width: p + '%' }}></div></div>
                 <div className="flex items-center justify-between mt-1 text-xs text-wood/80"><span>p. ${b.currentPage || 0} / ${b.pages} · ${p}%</span>
                 <button type="button" className="font-semibold text-forest hover:underline" onClick=${() => onUpdate(b.id, { currentPage: String(Math.min(+b.pages, (+b.currentPage || 0) + 10)) })}>+10 pages</button></div>`
              : html`<p className="text-xs text-wood/70 mt-1">Started ${fmtDate(b.startedAt) || 'recently'} · add page count in details to track progress</p>`}
          </div>
        </div>`;
      })}</div>
    </section>`}

    <div className="grid gap-4 md:grid-cols-2">
      <section className="card p-5 rise">
        <h2 className="section-title mb-1">Favourite genres</h2>
        <p className="text-xs text-wood/70 mb-3">${finished.length ? 'Based on your finished books' : 'Based on all books on your shelves'}</p>
        ${topGenres.length ? html`<div className="space-y-2.5">${topGenres.map(([g, n]) => html`<div key=${g}>
            <div className="flex justify-between text-sm"><span className="text-ink">${g}</span><span className="text-wood/70">${n}</span></div>
            <div className="h-2 rounded-full bg-parchment/60 overflow-hidden mt-1"><div className="h-full rounded-full bg-forest" style=${{ width: Math.round(n / maxG * 100) + '%' }}></div></div>
          </div>`)}</div>`
          : html`<p className="text-sm italic text-stone-500">Add genres to your books to see your favourites here.</p>`}
      </section>
      <section className="card p-5 rise">
        <h2 className="section-title mb-3">How they felt</h2>
        <div className="grid grid-cols-2 gap-2">${feel.map(([k, l, n], i) => html`<div key=${k} className=${'rounded-[4px] px-3 py-3 text-center ' + ['bg-[#7A2232] text-[#F6E7D2]', 'bg-[#24402F] text-[#F1E3BE]', 'bg-[#F4E6C8] text-[#7D5F2A]', 'bg-cream text-wood border border-parchment'][i]}>
          <p className="font-display text-3xl leading-none">${n}</p><p className="font-caps text-[12px] tracking-[.12em] mt-1 opacity-90">${l}</p></div>`)}</div>
      </section>
    </div>

    <section className="rise">
      <${Heading}>Books I've read<//>
      ${finished.length > 0 && html`<div className="space-y-2 mb-3">
        <div className="grid grid-cols-3 gap-2">
          <div className="col-span-2 relative"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-caramel"><${Icon} name="search" size=${16} /></span>
            <input className="field !pl-9 !py-2 text-sm" value=${jq} onChange=${(e) => setJq(e.target.value)} placeholder="Search finished books" aria-label="Search finished books" /></div>
          <select className="field !py-2 text-sm" value=${js} onChange=${(e) => setJs(e.target.value)} aria-label="Sort"><option value="date">Newest</option><option value="rating">Rating</option><option value="title">Title</option></select>
        </div>
        <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
          ${[['all', 'All ' + finished.length], ['fav', 'Favourites'], ['top', '4 stars & up'], ['unrated', 'Not rated yet']].map(([k, l]) => html`<button key=${k} type="button" onClick=${() => setJf(k)} aria-pressed=${jf === k} className=${cx('chip !py-1 text-[13px]', jf === k ? 'chip-on' : 'chip-off')}>${l}</button>`)}
        </div>
      </div>`}
      ${finished.length > 0 && !recent.length ? html`<p className="text-sm italic text-stone-500">No finished books match.</p>` : ''}
      ${recent.length ? html`<div className="space-y-2.5">${recent.map((b) => html`<button key=${b.id} onClick=${() => onOpen(b.id)} className="card w-full p-3 flex gap-3 items-start text-left hover:shadow-lift transition">
          <${Cover} book=${b} className="w-11 h-[66px] rounded shadow shrink-0" />
          <div className="flex-1 min-w-0">
            <div className="flex items-start justify-between gap-2"><p className="font-display text-[16px] font-semibold text-ink truncate">${b.favorite ? html`<span className="text-wine mr-1" aria-label="Favourite">♥</span>` : ''}${b.title}</p><span className="text-xs text-wood/70 shrink-0">${fmtDate(b.finishedAt)}</span></div>
            <div className="flex items-center gap-2 mt-0.5"><${Stars} value=${b.rating} size=${12} />${b.feeling && html`<span className="text-xs text-wood/80">${(FEELINGS.find((f) => f[0] === b.feeling) || [])[1]}</span>`}</div>
            ${b.notes && html`<p className="text-xs text-wood/80 mt-1 line-clamp-2 italic">“${b.notes}”</p>`}
          </div>
        </button>`)}</div>`
        : finished.length ? '' : html`<p className="text-sm italic text-stone-500">Nothing finished yet — when you mark a book as Finished it appears here.</p>`}
    </section>
  </div>`;
}

/* ───────────────────────── Wishlist / TBR ───────────────────────── */
function TBR({ books, onOpen, onUpdate, onQuick, onAdd, goDiscover, onRandom, onSuggest, enr, toast, settings, saveSettings, onRemove }) {
  const [removing, setRemoving] = useState(null);
  const [view, setView] = useState('wish');
  const col = 'all';
  const [q, setQ] = useState('');
  const [f, setF] = useState('all');
  const [mood, setMood] = useState('all');
  const tbrAll = books.filter((b) => b.status === 'tbr');
  const wish = tbrAll.filter(onWishlist), unread = tbrAll.filter(isOwned);
  const all = view === 'wish' ? wish : unread;
  const nq = norm(q);
  const colDef = null;
  const list = all.filter((b) => (!nq || norm(b.title + ' ' + b.author).includes(nq)) && (f === 'all' || (f === 'next' ? b.nextUp : b.priority === f)) && (mood === 'all' || moodsOf(b).has(mood))
      && (col === 'all' || !colDef || inCol(b, col)))
    .sort((a, b) => (colDef && colDef.ordered ? ((+a.seriesOrder || 999) - (+b.seriesOrder || 999)) : 0) || (b.nextUp - a.nextUp) || (PRIO_RANK[a.priority || ''] - PRIO_RANK[b.priority || '']) || String(b.addedAt).localeCompare(String(a.addedAt)));
  const prioCls = { high: 'bg-[#7A2232] text-[#F6E7D2] border-[#7A2232]', medium: 'bg-gold/20 text-caramelDark border-gold', low: 'bg-[#24402F]/10 text-[#24402F] border-[#24402F]/40' };

  return html`<div>
    <div className="flex items-center justify-between gap-3 mb-3">
      <div><h2 className="section-title">To Be Read</h2><p className="text-sm text-wood/80">${wish.length} on your wishlist · ${unread.length} unread on your shelf</p></div>
      <div className="flex gap-2 shrink-0">
        <button className="btn-soft !px-3" onClick=${goDiscover} title="Search books"><${Icon} name="search" size=${15} /><span className="hidden sm:inline">Search</span></button>
        <button className="btn-primary !px-3" onClick=${() => onAdd({ status: 'tbr', owned: view !== 'wish' })}><${Icon} name="plus" size=${15} /><span className="hidden sm:inline">Add</span></button>
      </div>
    </div>
    <div className="grid grid-cols-2 gap-1 p-1 rounded-[3px] bg-parchment/50 border border-parchment mb-3">
      ${[['wish', 'Wishlist', wish.length], ['shelf', 'Unread on my shelf', unread.length]].map(([k, l, n]) => html`<button key=${k} type="button" onClick=${() => setView(k)} aria-pressed=${view === k}
        className=${cx('rounded-[2px] py-2 px-1 font-caps text-[14px] tracking-[.08em] transition', view === k ? (k === 'wish' ? 'bg-wine text-[#F6E7D2] shadow' : 'bg-forest text-[#F1E3BE] shadow') : 'text-wood hover:bg-paper')}>${l} <span className="opacity-70">${n}</span></button>`)}
    </div>
    <${DetailsPanel} books=${tbrAll} enr=${enr} />
    ${all.length === 0
      ? html`<${Empty} title=${view === 'wish' ? 'Your wishlist is empty' : 'No unread books on your shelf'} text=${view === 'wish' ? 'Find something wonderful in Discover and tap “Wishlist”.' : 'Books you own but haven’t started yet appear here.'}>
          <button className="btn-primary" onClick=${goDiscover}><${Icon} name="search" size=${15} />Discover books</button><//>`
      : html`
        <div className="relative mb-2.5">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-caramel"><${Icon} name="search" size=${16} /></span>
          <input className="field !pl-9 !py-2 text-sm" value=${q} onChange=${(e) => setQ(e.target.value)} placeholder="Search your TBR" aria-label="Search TBR" />
        </div>
        <div className="grid grid-cols-2 gap-2 mb-3">
          <button type="button" className="btn !py-2.5 bg-[#24402F] text-[#F1E3BE] border-[#24402F] hover:brightness-110" onClick=${() => onRandom(list)}><${Icon} name="shuffle" size=${15} />Random pick</button>
          <button type="button" className="btn !py-2.5 bg-[#7A2232] text-[#F6E7D2] border-[#7A2232] hover:brightness-110" onClick=${onSuggest}><${Icon} name="wand" size=${15} />What next?</button>
        </div>
        <div className="mb-2"><${MoodFilter} value=${mood} onChange=${setMood} /></div>
        <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1 mb-3 items-center">
          <span className="label !mb-0 shrink-0 mr-1">Priority</span>
          ${[['all', 'All'], ['next', 'Next up'], ['high', 'High'], ['medium', 'Medium'], ['low', 'Low']].map(([k, l]) => html`<button key=${k} type="button" onClick=${() => setF(k)} aria-pressed=${f === k} className=${cx('chip !py-1 text-[13px]', f === k ? 'chip-on' : 'chip-off')}>${l}</button>`)}
        </div>
        ${list.length === 0 ? html`<p className="text-sm italic text-stone-500 py-6 text-center">No books match.</p>` : html`<div className="space-y-2.5">${list.map((b) => html`<article key=${b.id} className=${cx('card p-3 flex gap-3 rise', b.nextUp && 'ring-2 ring-gold/70')}>
          <button onClick=${() => onOpen(b.id)} className="shrink-0" aria-label=${'Open ' + b.title}><${Cover} book=${b} className="w-[60px] h-[90px] rounded-md shadow" /></button>

/* ───────────────────────── Backup sheet ───────────────────────── */
function BackupSheet({ open, onClose, lib, toast, enr }) {
  const [dl, setDl] = useState(null);
  const [mode, setMode] = useState('merge');
  const [paste, setPaste] = useState('');
  const [showJson, setShowJson] = useState(false);
  useEffect(() => { if (open) { setShowJson(false); getCap('downloads').then(setDl); } }, [open]);
  const json = () => JSON.stringify({ app: 'book-library', version: 1, exportedAt: new Date().toISOString(), settings: lib.settings, books: lib.books }, null, 2);
  const download = async () => {
    try { const r = await dl.save({ filename: 'book-library-' + todayISO() + '.json', data: json() }); if (r && r.status === 'saved') toast('Backup saved'); }
    catch (e) { if (e && e.code === 'declined') return; toast('Download isn’t available here — use Copy instead.', 'error'); setShowJson(true); }
  };
  const saveLocalFile = async () => {
    const name = 'book-library-' + todayISO() + '.json';
    const blob = new Blob([json()], { type: 'application/json' });
    try {
      const file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Book Library backup' }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try {
      const url = URL.createObjectURL(blob); const a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000); toast('Backup saved');
    } catch (e) { setShowJson(true); toast('Couldn’t save the file — copy the text below instead.', 'error'); }
  };
  const copy = async () => {
    try { await navigator.clipboard.writeText(json()); toast('Backup copied to clipboard'); }
    catch (e) { setShowJson(true); toast('Couldn’t copy automatically — select the text below.', 'error'); }
  };
  const doImport = (text) => {
    try {
      const data = JSON.parse(text);
      const arr = Array.isArray(data) ? data : data && data.books;
      if (!Array.isArray(arr)) throw new Error('shape');
      const n = lib.importBooks(arr, mode, data && data.settings);
      toast('Imported ' + n + ' ' + (n === 1 ? 'book' : 'books')); setPaste(''); onClose();
    } catch (e) { toast('That doesn’t look like a Book Library backup.', 'error'); }
  };
  const onFile = (e) => {
    const file = e.target.files && e.target.files[0]; e.target.value = '';
    if (!file) return;
    const r = new FileReader(); r.onload = () => doImport(String(r.result || '')); r.onerror = () => toast('Couldn’t read that file.', 'error'); r.readAsText(file);
  };
  const syncInfo = {
    cloud: ['cloud', 'Saved to your Claude account', 'Your library is stored privately with this page and follows you to other devices where you open it. A copy is also kept in this browser.'],
    connecting: ['cloud', 'Connecting…', 'Your library is saved in this browser while the connection is set up.'],
    slow: ['wifiOff', 'Still connecting', 'Changes are kept in this browser for now and will sync when the connection is back.'],
    local: ['wifiOff', 'Saved in this browser only', 'Your library lives in this browser’s storage. Export a backup regularly so nothing gets lost.'],
  }[lib.sync];
  return html`<${Sheet} open=${open} onClose=${onClose} title="Backup & storage">
    <div className="space-y-6">
      <div className="rounded-[3px] bg-parchment/40 border border-parchment p-4 flex gap-3">
        <span className="text-forest mt-0.5"><${Icon} name=${syncInfo[0]} size=${20} /></span>
        <div><p className="font-semibold text-ink">${syncInfo[1]}</p><p className="text-sm text-wood/80 mt-0.5">${syncInfo[2]}</p></div>
      </div>
      ${enr && html`<section>
        <p className="label">Book details</p>
        <p className="text-sm text-wood/80 mb-3">Covers, years, pages and summaries come only from Open Library and fill empty fields — nothing you entered is overwritten.${enr.st.phase === 'unreachable' ? ' Open Library is not reachable right now — are you offline?' : ''}</p>
        <button type="button" className="btn-soft" disabled=${enr.st.phase === 'running'} onClick=${() => { enr.setHidden(false); enr.run(true); }}><${Icon} name="download" size=${15} />${enr.st.phase === 'running' ? 'Loading… ' + enr.st.done + ' / ' + enr.st.total : 'Load missing details'}</button>
      </section>`}
      <section>
        <p className="label">Export</p>
        <p className="text-sm text-wood/80 mb-3">A JSON file with all ${lib.books.length} books, ratings, notes and settings — ready to import here again or into a PWA later.</p>
        <div className="flex flex-wrap gap-2">
          <button type="button" className="btn-primary" onClick=${dl ? download : saveLocalFile}><${Icon} name="download" size=${15} />Save backup file</button>
          <button type="button" className="btn-soft" onClick=${copy}><${Icon} name="copy" size=${15} />Copy JSON</button>
        </div>
        ${showJson && html`<textarea readOnly className="field mt-3 h-40 font-mono text-xs" value=${json()} onFocus=${(e) => e.target.select()}></textarea>`}
      </section>
      <section>
        <p className="label">Import</p>
        <div className="grid grid-cols-2 gap-1 p-1 rounded-[3px] bg-parchment/50 border border-parchment mb-3">
          ${[['merge', 'Merge with library'], ['replace', 'Replace library']].map(([k, l]) => html`<button key=${k} type="button" onClick=${() => setMode(k)} aria-pressed=${mode === k} className=${cx('rounded-[2px] py-2 font-caps text-[14px] tracking-[.1em] transition', mode === k ? 'bg-forest text-[#F1E3BE] shadow' : 'text-wood hover:bg-paper')}>${l}</button>`)}
        </div>
        ${mode === 'replace' && html`<p className="text-sm text-rose-800 bg-rose-50 border border-rose-200 rounded-[2px] px-3 py-2 mb-3">Replace removes every book that isn’t in the backup. Export first if you’re unsure.</p>`}
        <label className="btn-soft cursor-pointer"><${Icon} name="upload" size=${15} />Choose JSON file<input type="file" accept="application/json,.json,text/plain" className="sr-only" onChange=${onFile} /></label>
        <p className="text-xs text-wood/70 mt-3 mb-1.5">…or paste a backup:</p>
        <textarea className="field h-24 font-mono text-xs" value=${paste} onChange=${(e) => setPaste(e.target.value)} placeholder='{"app":"book-library","books":[…]}'></textarea>
        <button type="button" className="btn-primary mt-2" disabled=${!paste.trim()} onClick=${() => doImport(paste)}>Import pasted backup</button>
      </section>
    </div>
  <//>`;
}

/* ───────────────────────── App shell ───────────────────────── */
const TABS = [
  { id: 'discover', label: 'Discover', long: 'Discover', icon: 'compass' },
  { id: 'journal', label: 'Journal', long: 'Reading Journal', icon: 'bookOpen' },
  { id: 'tbr', label: 'To Be Read', long: 'To Be Read', icon: 'bookmark' },
];

function App() {
  const [toastMsg, setToastMsg] = useState(null);
  const toast = useCallback((msg, kind) => setToastMsg({ msg, kind: kind || 'ok', k: Date.now() }), []);
  useEffect(() => { if (!toastMsg) return; const t = setTimeout(() => setToastMsg(null), 2800); return () => clearTimeout(t); }, [toastMsg]);
  const lib = useLibrary(toast);
  const { books } = lib;

  const validTab = (v) => TABS.some((t) => t.id === v);
  const [tab, setTab] = useState(() => { const h = location.hash.slice(1); return validTab(h) ? h : (h === 'library' ? 'journal' : 'tbr'); });
  useEffect(() => { const h = () => { const v = location.hash.slice(1); if (validTab(v)) setTab(v); }; window.addEventListener('hashchange', h); return () => window.removeEventListener('hashchange', h); }, []);
  const go = (id) => { setTab(id); try { if (location.hash.slice(1) !== id) location.hash = id; } catch (e) {} window.scrollTo({ top: 0, behavior: 'smooth' }); };

  const [detailId, setDetailId] = useState(null);
  const [add, setAdd] = useState(null);
  const [backup, setBackup] = useState(false);
  const [focusKey, setFocusKey] = useState(0);
  const detail = books.find((b) => b.id === detailId) || null;
  const enr = useEnrichment(lib);
  const autoRan = useRef(false);
  useEffect(() => {
    if (autoRan.current || lib.sync === 'connecting') return;
    if (!books.some((b) => needsDetails(b, false))) return;
    autoRan.current = true; enr.run(false);
  }, [lib.sync, books.length]);
  const [pick, setPick] = useState(null);
  const randomPick = (cands) => {
    const pool = cands && cands.length ? cands : lib.getBooks().filter((b) => b.status === 'tbr');
    if (!pool.length) { toast('Your TBR is empty'); return; }
    let i = Math.floor(Math.random() * pool.length);
    if (pool.length > 1 && pick && pool[i].id === pick.book.id) i = (i + 1) % pool.length;
    setPick({ kind: 'random', book: pool[i], pool });
  };
  const suggest = () => {
    const r = suggestNext(lib.getBooks(), pick && pick.kind === 'suggest' ? pick.book.id : null);
    if (!r) { toast('Add books to your TBR first'); return; }
    setPick({ kind: 'suggest', ...r });
  };

  const openDetail = useCallback((id) => setDetailId(id), []);
  const closeDetail = useCallback(() => setDetailId(null), []);
  const addFromResult = async (r, status, owned) => {
    const b = withStatus(makeBook({
      title: r.title, author: r.author, year: r.year, genres: r.genres || [], pages: r.pages || '', language: r.language || '',
      coverUrl: r.coverUrl || '', olKey: r.olKey || '', description: r.description || '',
      descriptionSource: r.description ? (r.source === 'claude' ? 'claude' : 'openlibrary') : '',
      owned: status !== 'tbr' || !!owned,
    }), status);
    lib.upsert(b);
    toast(status === 'tbr' ? (owned ? 'Added to To Be Read · on your shelf' : 'Added to To Be Read') : 'Added to ' + STATUS[status].label);
    if (r.source === 'openlibrary' && r.description == null && r.olKey) {
      const d = await fetchOLDescription(r.olKey);
      if (d) lib.update(b.id, (cur) => (cur.description ? cur : { ...cur, description: d, descriptionSource: 'openlibrary' }));
    }
  };
  const onQuick = (b, to) => {
    lib.update(b.id, (cur) => withStatus(cur, to));
    toast('Moved to ' + STATUS[to].label);
    if (to === 'finished') setDetailId(b.id);
  };
  const onManualSubmit = (v) => {
    const b = withStatus(makeBook({ ...v, descriptionSource: v.description ? 'manual' : '' }), v.status || 'tbr');
    lib.upsert(b); setAdd(null); toast('Added “' + b.title + '”');
  };
  const onDuplicate = (b) => {
    const c = { ...b, id: newId(), title: b.title + ' (copy)', addedAt: new Date().toISOString(), olKey: b.olKey };
    lib.upsert(c); setDetailId(c.id); toast('Duplicated');
  };
  const onDelete = (b) => { setDetailId(null); lib.remove(b.id); toast('Removed “' + b.title + '”'); };
  const goSearch = () => { setAdd(null); go('discover'); setFocusKey((k) => k + 1); };

  const reading = books.filter((b) => b.status === 'reading').length;
  const finished = books.filter((b) => b.status === 'finished').length;

  const navBtn = (t, mobile) => html`<button key=${t.id} type="button" onClick=${() => go(t.id)} aria-current=${tab === t.id ? 'page' : undefined}
    className=${mobile
      ? cx('relative flex-1 flex flex-col items-center gap-1 pt-2.5 pb-1.5 font-caps text-[12px] tracking-[.12em] transition', tab === t.id ? 'text-forest' : 'text-wood/60')
      : cx('relative flex items-center gap-2 px-5 py-2 font-caps text-[15px] tracking-[.16em] transition', tab === t.id ? 'text-forest' : 'text-wood/70 hover:text-forest')}>
    ${tab === t.id && html`<span className=${mobile ? 'absolute top-0 left-1/4 right-1/4 h-[2px] bg-wine' : 'absolute -bottom-[13px] left-4 right-4 h-[2px] bg-wine'}></span>`}
    <${Icon} name=${t.icon} size=${mobile ? 19 : 15} stroke=${tab === t.id ? 1.9 : 1.5} />
    ${mobile ? t.label : t.long}
  </button>`;

  return html`<div className="min-h-screen pb-[calc(96px+env(safe-area-inset-bottom))] md:pb-16">
    <header className="relative overflow-hidden pt-[env(safe-area-inset-top)] bg-[#FBF8F1] border-b border-parchment shadow-card">
      <svg className="absolute inset-x-0 top-0 w-full h-[150px] text-gold pointer-events-none" viewBox="0 0 1200 150" preserveAspectRatio="none" aria-hidden="true" fill="none" stroke="currentColor">
        ${[0, 1, 2, 3, 4, 5].map((i) => html`<path key=${i} d=${'M' + (i * 200) + ' 150 V70 Q' + (i * 200 + 100) + ' -10 ' + (i * 200 + 200) + ' 70 V150'} strokeOpacity=".22" strokeWidth="1" />`)}
        ${[0, 1, 2, 3, 4, 5].map((i) => html`<path key=${'b' + i} d=${'M' + (i * 200 + 14) + ' 150 V76 Q' + (i * 200 + 100) + ' 6 ' + (i * 200 + 186) + ' 76 V150'} strokeOpacity=".12" strokeWidth="1" />`)}
      </svg>
      <div className="absolute inset-0 bg-[radial-gradient(700px_220px_at_50%_0%,rgba(255,244,214,.9),transparent_70%)] pointer-events-none"></div>
      <div className="relative max-w-5xl mx-auto px-5 sm:px-6 pt-8 pb-5 text-center">
        <button type="button" onClick=${() => setBackup(true)} className="absolute right-4 sm:right-6 top-5 w-10 h-10 grid place-items-center border border-gold/60 text-forest hover:bg-gold/10 transition" aria-label="Backup & storage" title="Backup & storage">
          <${Icon} name="archive" size=${17} stroke=${1.6} />
        </button>
        <h1 className="font-display font-semibold text-[27px] min-[400px]:text-[31px] sm:text-[52px] tracking-[.1em] sm:tracking-[.16em] text-forest leading-none px-10 sm:px-0 whitespace-nowrap">BOOK LIBRARY</h1>
        <${Ornament} className="mx-auto mt-3" />
        <p className="font-display italic text-[20px] sm:text-[22px] text-wine mt-2">Your enchanted reading library</p>
        <div className="flex flex-wrap justify-center gap-x-4 gap-y-1 mt-4 font-caps text-[13px] tracking-[.1em] text-wood">
          <span><b className="font-display text-[19px] text-wine tracking-normal">${books.filter((b) => b.status === 'tbr').length}</b> to be read</span>
          <span><b className="font-display text-[19px] text-forest tracking-normal">${reading}</b> reading</span>
          <span><b className="font-display text-[19px] text-forest tracking-normal">${finished}</b> finished</span>
        </div>
        <nav className="hidden md:flex justify-center gap-1 mt-5 border-t border-parchment pt-3" aria-label="Sections">${TABS.map((t) => navBtn(t, false))}</nav>
      </div>
      <div className="gilt-rule mx-0"></div>
    </header>

    <main className="max-w-5xl mx-auto px-4 sm:px-6 pt-5">
      <section hidden=${tab !== 'discover'}><${Discover} books=${books} onAdd=${addFromResult} onOpen=${openDetail} onManual=${(init) => setAdd(init || {})} focusKey=${focusKey} onSuggest=${suggest} onRandom=${randomPick} /></section>
      <section hidden=${tab !== 'journal'}><${Journal} books=${books} settings=${lib.settings} saveSettings=${lib.saveSettings} onOpen=${openDetail} onUpdate=${lib.update} /></section>
      <section hidden=${tab !== 'tbr'}><${TBR} books=${books} onOpen=${openDetail} onUpdate=${lib.update} onQuick=${onQuick} onAdd=${(init) => setAdd(init || {})} goDiscover=${goSearch} onRandom=${randomPick} onSuggest=${suggest} enr=${enr} toast=${toast} settings=${lib.settings} saveSettings=${lib.saveSettings} onRemove=${onDelete} /></section>
    </main>

    <button type="button" onClick=${() => setAdd(tab === 'journal' ? { status: 'finished', owned: true } : { status: 'tbr', owned: false })} aria-label="Add a book"
      className="fixed z-30 right-4 sm:right-6 bottom-[calc(84px+env(safe-area-inset-bottom))] md:bottom-8 w-14 h-14 rounded-full bg-forest text-[#EAD59A] shadow-lift grid place-items-center hover:scale-105 active:scale-95 transition border border-gold ring-4 ring-[#FBF8F1]">
      <${Icon} name="plus" size=${26} stroke=${2.4} />
    </button>

    <nav className="md:hidden fixed z-30 bottom-0 inset-x-0 bg-[#FBF8F1]/95 backdrop-blur-md border-t border-gold/40 px-2 pb-[calc(6px+env(safe-area-inset-bottom))] flex" aria-label="Sections">
      ${TABS.map((t) => navBtn(t, true))}
    </nav>

    <${DetailSheet} book=${detail} books=${books} onClose=${closeDetail} onUpdate=${lib.update} onDuplicate=${onDuplicate} onDelete=${onDelete} toast=${toast} />
    <${AddSheet} open=${!!add} initial=${add} onClose=${() => setAdd(null)} onSubmit=${onManualSubmit} goSearch=${goSearch} />
    <${PickSheet} pick=${pick} onClose=${() => setPick(null)} onAnother=${() => (pick.kind === 'random' ? randomPick(pick.pool) : suggest())}
      onStart=${(b) => { setPick(null); onQuick(b, 'reading'); }} onOpen=${(id) => { setPick(null); setDetailId(id); }} />
    <${BackupSheet} open=${backup} onClose=${() => setBackup(false)} lib=${lib} toast=${toast} enr=${enr} />

    ${toastMsg && html`<div key=${toastMsg.k} role="status" className=${cx('fixed z-[60] left-1/2 -translate-x-1/2 bottom-[calc(150px+env(safe-area-inset-bottom))] md:bottom-28 max-w-[90vw] px-5 py-2.5 shadow-lift font-display text-[17px] italic rise',
      toastMsg.kind === 'error' ? 'bg-[#7A2232] text-white border border-gold/60' : 'bg-forest text-[#F1E3BE] border border-gold/70')}>${toastMsg.msg}</div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
</script>
</body>
</html>
